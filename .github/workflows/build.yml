name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlyerSummon
          path: |
            bin/Release/netstandard2.1/FlyerSummon.dll
            bin/Release/netstandard2.1/FlyerSummon.pdb

      - name: Attach DLL to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/netstandard2.1/FlyerSummon.dll
            bin/Release/netstandard2.1/FlyerSummon.pdb
